<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.json">
<title>IELTS + SAT Tracker</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f3f4f6;color:#111827}
header{background:#111827;color:#fff;padding:18px 20px;position:sticky;top:0;z-index:10}
.header{max-width:1200px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px}
h1{margin:0;font-size:22px}.sub{font-size:13px;color:#cbd5e1;margin-top:4px}
button{border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}
.install{background:#fff;color:#111827}.reset{background:#374151;color:#fff}
main{max-width:1200px;margin:auto;padding:18px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:16px}
.card .label{font-size:13px;color:#64748b}.card .value{font-size:26px;font-weight:800;margin-top:5px}
.table-wrap{background:#fff;border:1px solid #e5e7eb;border-radius:14px;overflow:auto}
table{border-collapse:collapse;width:100%;min-width:1050px}
th,td{padding:9px 8px;border-right:1px solid #e5e7eb;border-bottom:1px solid #e5e7eb;text-align:center;white-space:nowrap}
th{background:#f8fafc;position:sticky;top:0;z-index:2;font-size:12px}
td:nth-child(2),th:nth-child(2){text-align:left}
select{border:0;border-radius:18px;padding:7px 10px;font-weight:700;min-width:94px;cursor:pointer}
.empty{background:#e5e7eb;color:#374151}.done{background:#16a34a;color:white}.not{background:#dc2626;color:white}
.progress{font-weight:800}.pct{font-weight:800}
@media(max-width:700px){header{padding:14px}.header{align-items:flex-start}.cards{grid-template-columns:repeat(2,1fr)}main{padding:10px}.card{padding:12px}.card .value{font-size:22px}h1{font-size:18px}}
</style>
</head>
<body>
<header><div class="header">
<div><h1>IELTS + SAT TRACKER</h1><div class="sub">Daily study tracker • saved automatically</div></div>
<div><button class="install" id="installBtn" hidden>Install App</button> <button class="reset" onclick="resetAll()">Reset</button></div>
</div></header>
<main>
<div class="cards">
<div class="card"><div class="label">Overall tasks</div><div class="value" id="overall">0 / 0</div></div>
<div class="card"><div class="label">Completed</div><div class="value" id="completed">0</div></div>
<div class="card"><div class="label">Overall progress</div><div class="value" id="overallPct">0%</div></div>
<div class="card"><div class="label">Study days</div><div class="value">30</div></div>
</div>
<div class="table-wrap"><table><thead><tr>
<th>№</th><th>DATE</th><th>LISTENING</th><th>READING</th><th>SPEAKING</th><th>WRITING TASK 1</th><th>WRITING TASK 2</th><th>SAT MATH</th><th>SAT R/W</th><th>PROGRESS</th><th>PERCENT</th>
</tr></thead><tbody id="body"></tbody></table></div>
</main>
<script>
const tasks=["LISTENING","READING","SPEAKING","WRITING TASK 1","WRITING TASK 2","SAT MATH","SAT R/W"];
const statuses=[["EMPTY","empty"],["DONE","done"],["NOT H/W","not"]];
const start=new Date(2026,8,17);
let data=JSON.parse(localStorage.getItem("ieltsSatTracker")||"{}");
const body=document.getElementById("body");
for(let i=0;i<30;i++){
  const d=new Date(start); d.setDate(start.getDate()+i);
  const date=d.toLocaleDateString("en-GB",{day:"2-digit",month:"2-digit",year:"numeric"}).replaceAll("/",".");
  const tr=document.createElement("tr");
  tr.innerHTML=`<td>${i+1}</td><td>${date}</td>`+
    tasks.map((_,j)=>`<td><select data-i="${i}" data-j="${j}"></select></td>`).join("")+
    `<td class="progress" id="p${i}">0/7</td><td class="pct" id="q${i}">0%</td>`;
  body.appendChild(tr);
}
document.querySelectorAll("select").forEach(s=>{
  statuses.forEach(([text,cls])=>{const o=document.createElement("option");o.value=text;o.textContent=text;s.appendChild(o)});
  const key=s.dataset.i+"-"+s.dataset.j;
  s.value=data[key]||"EMPTY"; paint(s);
  s.addEventListener("change",()=>{data[key]=s.value;localStorage.setItem("ieltsSatTracker",JSON.stringify(data));paint(s);update()});
});
function paint(s){s.className=s.value==="DONE"?"done":s.value==="NOT H/W"?"not":"empty"}
function update(){
  let done=0,total=30*7;
  for(let i=0;i<30;i++){let n=0;document.querySelectorAll(`select[data-i="${i}"]`).forEach(s=>{if(s.value==="DONE")n++});
    document.getElementById("p"+i).textContent=n+"/7";
    document.getElementById("q"+i).textContent=Math.round(n/7*100)+"%"; done+=n;
  }
  document.getElementById("completed").textContent=done;
  document.getElementById("overall").textContent=done+" / "+total;
  document.getElementById("overallPct").textContent=Math.round(done/total*100)+"%";
}
function resetAll(){if(confirm("Reset all progress?")){data={};localStorage.removeItem("ieltsSatTracker");location.reload()}}
update();
let deferredPrompt;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredPrompt=e;document.getElementById("installBtn").hidden=false});
document.getElementById("installBtn").onclick=async()=>{if(deferredPrompt){deferredPrompt.prompt();deferredPrompt=null}};
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script>
</body></html>
